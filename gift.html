<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Free drink at La Cabaña Grill</title>
<meta property="og:title" content="A free drink at La Cabaña Grill"/><meta property="og:description" content="With your meal. Colombian grill in Miami Beach."/>
<meta name="theme-color" content="#0c0c0c"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/><link rel="icon" type="image/png" href="icons/favicon-64.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0c0c0c;color:#f5f5f5;font-family:Manrope,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px)}
  .logo{height:46px;display:block;margin:0 auto 10px}
  .from{text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.14em;color:#ffb27a;text-transform:uppercase}
  h1{font-family:Outfit;font-size:30px;line-height:1.05;margin:6px 0 0;text-align:center}
  .ticket{position:relative;background:linear-gradient(150deg,#ff9a52,#f36310 55%,#c94a05);color:#1a0800;border-radius:26px;padding:22px 20px 20px;margin-top:18px;box-shadow:0 20px 50px rgba(243,99,16,.28);text-align:center}
  .ticket small{font-weight:800;font-size:12px;letter-spacing:.16em}
  .pin{font-family:Outfit;font-weight:800;font-size:76px;letter-spacing:.16em;line-height:1;margin:10px 0 6px;padding-left:.16em}
  .once{font-weight:800;font-size:13px}
  .cut{border-top:2px dashed rgba(26,8,0,.35);margin:18px -20px 14px;position:relative}
  .cut:before,.cut:after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#0c0c0c}
  .cut:before{left:-11px}.cut:after{right:-11px}
  .what{font-weight:700;font-size:14.5px;line-height:1.4}
  .used{background:#1d1d1d;color:#8a8a8a;box-shadow:none}
  .shot{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 0;font-weight:800;font-size:15px;color:#fff}
  .box{background:#161616;border:1px solid #262626;border-radius:22px;padding:16px 18px;margin-top:14px}
  .box b{display:block;font-size:15px}.box span{color:#9a9a9a;font-size:13.5px}
  .row{display:flex;gap:8px;margin-top:10px}
  input{flex:1;min-width:0;font:600 16px Manrope,sans-serif;color:#fff;background:#0f0f0f;border:1px solid #2e2e2e;border-radius:14px;padding:12px 14px;outline:none}
  input:focus{border-color:#f36310}
  .btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:800 15px Manrope,sans-serif;border-radius:14px;padding:12px 16px;cursor:pointer;text-align:center}
  .btn.main{background:#f36310;color:#1a0800}
  .btn.ghost{border:1px solid #333;color:#fff;width:100%;margin-top:10px}
  .fine{color:#7a7a7a;font-size:12.5px;line-height:1.5;margin:14px 2px 0;text-align:center}
</style>
</head><body>
<div class="wrap" id="w"><p class="fine" style="padding-top:80px">Getting your free drink…</p></div>
<script>
(async function () {
  const SB = 'https://qzluvwpjtgeccfojutbt.supabase.co', H = { apikey: 'sb_publishable_LA6q8PrfQSRC5d7tanAamg_erxp0ShJ', 'Content-Type': 'application/json' };
  const rpc = async (fn, body) => { const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: H, body: JSON.stringify(body) }); const j = r.status === 204 ? null : await r.json(); if (!r.ok) throw new Error((j && j.message) || 'error'); return j; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const first = s => String(s || '').trim().split(/\s+/)[0];
  const MAP = 'https://maps.apple.com/?q=La+Caba%C3%B1a+Grill&address=6780+Collins+Ave,+Miami+Beach,+FL';
  const w = document.getElementById('w');
  const ref = (new URLSearchParams(location.search).get('ref') || '').toUpperCase();
  const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let dev = ls('lc_vid'); if (!dev) { dev = Math.random().toString(36).slice(2) + Date.now().toString(36); ls('lc_vid', dev); }
  let saved = null; try { saved = JSON.parse(ls('lc_pin') || 'null'); } catch (e) {}

  if (/^[A-Z0-9]{4,12}$/.test(ref)) {
    ls('lc_ref', ref);   // a first online order still counts for the member too
    fetch(SB + '/rest/v1/rpc/log_visit', { method: 'POST', headers: H, body: JSON.stringify({ p_vid: dev, p_page: 'gift', p_ref: ref }) }).catch(() => {});
  }

  function show(g) {
    w.innerHTML = '<img class="logo" src="icons/logo-transparent.png" alt="La Cabaña Grill">' +
      (g.used ? '<h1>Enjoy your drink</h1>' : '<div class="from">From ' + esc(first(g.member)) + '</div><h1>Your free drink<br>is ready</h1>') +
      '<div class="ticket' + (g.used ? ' used' : '') + '"><small>' + (g.used ? 'USED' : 'YOUR PIN') + '</small><div class="pin">' + esc(g.code) + '</div><div class="once">' + (g.used ? 'This PIN was already used' : 'Works one time') + '</div>' +
      '<div class="cut"></div><div class="what">Free drink with your meal.<br>Show this PIN to your waiter.</div></div>' +
      (g.used ? '' : '<div class="shot">Take a screenshot</div>' +
        '<div class="box"><b>Tell ' + esc(first(g.member)) + ' it was you</b><span>Optional. So they see you came.</span><div class="row"><input id="nm" placeholder="Your first name" autocapitalize="words" value="' + esc(g.name || '') + '"><button class="btn main" id="nm-go">' + (g.name ? 'Saved' : 'Save') + '</button></div></div>') +
      '<div class="box"><b>La Cabaña Grill</b><span>6780 Collins Ave, Miami Beach</span><a class="btn ghost" href="' + MAP + '" target="_blank" rel="noopener">Directions</a><a class="btn ghost" href="menu.html">See the menu</a></div>' +
      '<p class="fine">One free drink per PIN, with the purchase of a meal.</p>';
    const go = document.getElementById('nm-go');
    if (go) go.onclick = async () => {
      const v = document.getElementById('nm').value.trim(); if (!v) return;
      go.textContent = '…';
      try { await rpc('pin_name', { p_code: g.code, p_device: dev, p_name: v }); g.name = v; ls('lc_pin', JSON.stringify(g)); go.textContent = 'Saved'; } catch (e) { go.textContent = 'Save'; }
    };
  }

  // same phone, same member: keep showing the PIN they already got
  if (saved && saved.code && (!ref || saved.ref === ref)) {
    show(saved);
    try { if (!saved.used && await rpc('pin_used', { p_code: saved.code, p_device: dev })) { saved.used = true; ls('lc_pin', JSON.stringify(saved)); show(saved); } } catch (e) {}
    return;
  }
  if (!/^[A-Z0-9]{4,12}$/.test(ref)) { location.replace('home.html'); return; }
  try {
    const r = (await rpc('get_pin', { p_ref: ref, p_device: dev }))[0];
    saved = { code: r.code, member: r.member_name, ref, used: false };
    ls('lc_pin', JSON.stringify(saved)); show(saved);
  } catch (e) { location.replace('home.html'); }
})();
</script>
</body></html>
