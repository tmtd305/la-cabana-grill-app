<!DOCTYPE html>
<html class="dark" lang="en"><head><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>La Cabaña Grill · Menu preview</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#131313"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/><link rel="icon" type="image/png" href="icons/favicon-64.png?v=2"/>
<script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-variant": "#353534", "on-primary-container": "#4d1900", "on-tertiary-container": "#00226e", "on-secondary-container": "#5b3800", "outline-variant": "#594137", "surface-container-low": "#1c1b1b", "surface-tint": "#ffb596", "surface-dim": "#131313", "error-container": "#93000a", "on-surface-variant": "#e2bfb2", "on-secondary-fixed-variant": "#653e00", "secondary-fixed-dim": "#ffb95f", "flame-glow": "rgba(230, 90, 0, 0.24)", "on-secondary-fixed": "#2a1700", "surface-container-highest": "#353534", "on-tertiary-fixed": "#00164e", "tertiary-fixed": "#dce1ff", "on-error": "#690005", "colombian-red": "#DC2626", "on-primary-fixed-variant": "#7d2d00", "outline": "#a98a7e", "inverse-surface": "#e5e2e1", "secondary-fixed": "#ffddb8", "surface-container-lowest": "#0e0e0e", "text-secondary": "#9CA3AF", "text-primary": "#F9FAFB", "error": "#ffb4ab", "on-primary": "#581e00", "text-muted": "#6B7280", "surface-raised": "#242424", "tertiary-fixed-dim": "#b6c4ff", "background": "#131313", "on-background": "#e5e2e1", "primary": "#ffb596", "secondary-container": "#ee9800", "border-highlight": "rgba(230, 90, 0, 0.35)", "on-error-container": "#ffdad6", "border-subtle": "rgba(255, 255, 255, 0.08)", "surface": "#131313", "primary-fixed-dim": "#ffb596", "on-tertiary": "#05297a", "tertiary": "#b6c4ff", "colombian-blue": "#2563EB", "primary-container": "#f36310", "surface-bright": "#393939", "surface-container": "#201f1f", "surface-elevated": "#2E2E2E", "inverse-primary": "#a33e00", "secondary": "#ffb95f", "tertiary-container": "#748de1", "surface-container-high": "#2a2a2a", "on-surface": "#e5e2e1", "on-tertiary-fixed-variant": "#264191", "primary-fixed": "#ffdbcd", "colombian-yellow": "#FBBF24", "surface-charcoal": "#1A1A1A", "inverse-on-surface": "#313030", "on-primary-fixed": "#360f00", "on-secondary": "#472a00" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "2rem", "space-xs": "0.25rem", "gutter-tablet": "1.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "space-2xl": "3rem", "margin-tablet": "2rem", "space-md": "1rem", "margin": "1rem" }, fontFamily: { "body-md": ["Manrope"], "headline-md": ["Outfit"], "label-lg": ["Manrope"], "display-lg-mobile": ["Outfit"], "body-lg": ["Manrope"], "headline-lg": ["Outfit"], "label-caps": ["Outfit"], "title-sm": ["Outfit"], "headline-xl": ["Outfit"], "body-sm": ["Manrope"], "label-md": ["Manrope"], "display-lg": ["Outfit"] }, fontSize: { "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-md": ["18px", { lineHeight: "24px", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "600" }], "display-lg-mobile": ["32px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["22px", { lineHeight: "28px", fontWeight: "600" }], "label-caps": ["11px", { lineHeight: "14px", letterSpacing: "0.08em", fontWeight: "700" }], "title-sm": ["16px", { lineHeight: "22px", fontWeight: "600" }], "headline-xl": ["28px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }] } } } };</script>
<script src="data.js"></script><script src="cart.js"></script><script src="dish.js"></script>
<style>
  :root{--bg:#131313;--card:#1c1b1b;--card2:#242424;--line:rgba(255,255,255,.08);--txt:#F9FAFB;--sub:#9CA3AF;--fire:#f36310;--fire2:#ffb596;--gold:#FBBF24;}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  .hdr{position:sticky;top:0;z-index:40;background:rgba(19,19,19,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top) + 10px) 16px 0 16px;}
  .hrow{display:flex;align-items:center;gap:10px;}
  .logo{height:34px;width:auto;background:#fff;border-radius:10px;padding:3px 6px;}
  .hrow .t{flex:1;min-width:0;}
  .hrow b{display:block;font:800 17px Outfit,sans-serif;letter-spacing:-.01em;}
  .hrow small{display:block;font-size:11.5px;color:var(--sub);font-weight:600;}
  .ib{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:#1f1f1f;display:flex;align-items:center;justify-content:center;position:relative;}
  .ib .material-symbols-outlined{font-size:22px;color:#e5e2e1;}
  .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--fire);color:#fff;font:800 10.5px Manrope;display:none;align-items:center;justify-content:center;padding:0 4px;}
  .mode{display:flex;background:#1f1f1f;border-radius:100px;padding:3px;margin:12px 0 0 0;}
  .mode button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 0;border-radius:100px;font:700 13px Manrope;color:var(--sub);}
  .mode button.on{background:var(--fire);color:#fff;box-shadow:0 4px 14px rgba(243,99,16,.4);}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0 -16px;padding:0 16px 10px 16px;scroll-behavior:smooth;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{all:unset;cursor:pointer;flex-shrink:0;padding:9px 15px;border-radius:100px;background:#1f1f1f;font:700 13px Manrope;color:#d1d1d1;transition:background .2s,color .2s,transform .2s;}
  .chip.on{background:#fff;color:#131313;transform:scale(1.04);}
  .note{margin:12px 16px 0;padding:10px 12px;border-radius:14px;background:rgba(243,99,16,.12);border:1px solid rgba(243,99,16,.3);font-size:12.5px;color:#ffd5c2;line-height:1.4;}
  main{padding:4px 12px calc(env(safe-area-inset-bottom) + 110px) 12px;}
  section{scroll-margin-top:150px;}
  h2{font:800 22px Outfit,sans-serif;margin:22px 4px 12px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;}
  h2 span{font:600 12.5px Manrope;color:var(--sub);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{position:relative;background:var(--card);border-radius:20px;overflow:visible;cursor:pointer;perspective:900px;}
  .pic{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;transform-style:preserve-3d;transform:rotateY(0deg);will-change:transform;box-shadow:0 10px 24px rgba(0,0,0,.45);}
  .pic img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);transition:transform .6s ease;}
  .pic::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(var(--shine,-60%));pointer-events:none;mix-blend-mode:soft-light;}
  /* the 360 spin when a dish scrolls into view */
  .card.spin .pic{animation:spin360 1.1s cubic-bezier(.2,.75,.25,1) both;}
  @keyframes spin360{0%{transform:rotateY(-360deg) scale(.7);opacity:0;}55%{opacity:1;}100%{transform:rotateY(0deg) scale(1);opacity:1;}}
  .card.spin .pic::after{animation:shine 1.4s .5s ease both;}
  @keyframes shine{from{transform:translateX(-60%);}to{transform:translateX(60%);}}
  .tag{position:absolute;top:10px;left:10px;z-index:2;font:800 10px Outfit;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:var(--gold);}
  .info{padding:10px 10px 12px 10px;display:flex;align-items:flex-end;gap:8px;}
  .info .t{flex:1;min-width:0;}
  .info b{display:block;font:700 14.5px Outfit,sans-serif;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .info i{display:block;font-style:normal;font:800 15px Manrope;color:var(--fire2);margin-top:4px;}
  .add{all:unset;cursor:pointer;flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--fire);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(243,99,16,.5);transition:transform .15s;}
  .add:active{transform:scale(.85);}
  .add .material-symbols-outlined{font-size:24px;color:#fff;font-variation-settings:'wght' 700;}
  .add.done{background:#22c55e;box-shadow:0 6px 16px rgba(34,197,94,.5);}
  .fly{position:fixed;z-index:80;width:46px;height:46px;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s;}
  .bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:50;display:none;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:20px;background:var(--fire);color:#fff;box-shadow:0 14px 34px rgba(243,99,16,.45);cursor:pointer;animation:up .3s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
  .bar .n{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font:800 13px Manrope;}
  .bar b{flex:1;font:800 15.5px Outfit;}
  .bar span.p{font:800 15.5px Manrope;}
  @media (min-width:700px){ .grid{grid-template-columns:repeat(3,1fr);} main{max-width:980px;margin:0 auto;} }
</style></head>
<body>
<div class="hdr">
  <div class="hrow"><img class="logo" src="icons/logo-transparent.png" alt="La Cabaña Grill"/><div class="t"><b>La Cabaña Grill</b><small>Miami Beach · ready in 15 to 25 min</small></div>
    <a class="ib" href="cart.html" aria-label="Cart"><span class="material-symbols-outlined">shopping_bag</span><span class="badge" data-cart-badge>0</span></a></div>
  <div class="mode"><button class="on" data-m="pickup">Pickup</button><button data-m="delivery">Delivery</button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="note">Preview of the new menu page. Scroll down: the sections at the top switch as you go. Tap + to add, or tap a dish for options.</div>
<main id="menu"></main>
<div class="bar" id="bar" onclick="location.href='cart.html'"><span class="n" id="bar-n">0</span><b>View cart</b><span class="p" id="bar-p">$0.00</span></div>

<script>
  const ORDER = ['favorites', 'steak', 'chicken', 'seafood', 'rice', 'streetfood', 'juice'];
  const LABEL = { favorites: 'House favorites', steak: 'Steak and Parrilla', chicken: 'Chicken', seafood: 'Seafood', rice: 'Rice and Sides', streetfood: 'Street food', juice: 'Natural juices' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => '$' + Number(n).toFixed(2);
  const groups = {};
  groups.favorites = MENU.filter(i => i.specialty).slice(0, 6);
  ORDER.slice(1).forEach(c => groups[c] = ALL_ITEMS.filter(i => i.category === c));
  const cats = ORDER.filter(c => groups[c] && groups[c].length);

  document.getElementById('chips').innerHTML = cats.map((c, i) => '<button class="chip' + (i ? '' : ' on') + '" data-c="' + c + '">' + LABEL[c] + '</button>').join('');
  document.getElementById('menu').innerHTML = cats.map(c => '<section id="s-' + c + '" data-c="' + c + '"><h2>' + LABEL[c] + '<span>' + groups[c].length + '</span></h2><div class="grid">' +
    groups[c].map(it => '<div class="card" data-dish="' + it.id + '"><div class="pic">' + (it.badge || it.tag ? '<span class="tag">' + esc(it.badge || it.tag) + '</span>' : '') +
      '<img src="' + esc(it.img) + '" alt="" loading="lazy"/></div><div class="info"><div class="t"><b>' + esc(it.name) + '</b><i>' + money(it.price) + '</i></div>' +
      '<button class="add" data-add="' + it.id + '" aria-label="Add ' + esc(it.name) + '"><span class="material-symbols-outlined">add</span></button></div></div>').join('') + '</div></section>').join('');

  // the 360 spin as each dish comes into view (once)
  const spinObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('spin'); spinObs.unobserve(e.target); } }), { threshold: 0.35 });
  document.querySelectorAll('.card').forEach(c => spinObs.observe(c));

  // sections at the top follow your scroll, like Uber Eats
  const chips = document.getElementById('chips');
  let lock = 0;
  function setChip(c) {
    chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.c === c));
    const on = chips.querySelector('.chip.on'); if (on) chips.scrollTo({ left: on.offsetLeft - 16, behavior: 'smooth' });
  }
  window.addEventListener('scroll', () => {
    if (Date.now() < lock) return;
    const y = window.scrollY + 170; let cur = cats[0];
    cats.forEach(c => { const s = document.getElementById('s-' + c); if (s.offsetTop <= y) cur = c; });
    if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 4) cur = cats[cats.length - 1];
    setChip(cur);
  }, { passive: true });
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { lock = Date.now() + 700; setChip(b.dataset.c); document.getElementById('s-' + b.dataset.c).scrollIntoView({ behavior: 'smooth' }); });

  // plates tilt and shine as you move your phone (or your mouse on a computer)
  let tx = 0, ty = 0;
  function tilt() {
    document.querySelectorAll('.card.spin .pic').forEach(p => {
      const r = p.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
      if (p.getAnimations && p.getAnimations().some(a => a.playState === 'running')) return;
      const k = ((r.top + r.height / 2) / innerHeight - 0.5);   // dishes lean as they scroll past
      p.style.transform = 'rotateX(' + (ty * 8 - k * 8).toFixed(2) + 'deg) rotateY(' + (tx * 10).toFixed(2) + 'deg)';
      p.style.setProperty('--shine', (tx * 50 - k * 40).toFixed(1) + '%');
    });
    requestAnimationFrame(tilt);
  }
  requestAnimationFrame(tilt);
  window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); });
  window.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; });
  document.addEventListener('touchstart', function askMotion() {   // iPhone asks permission for motion once
    document.removeEventListener('touchstart', askMotion);
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
  }, { passive: true });

  // quick add: the dish flies into the cart
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    e.stopPropagation(); addToCart(b.dataset.add, 1);
    const img = b.closest('.card').querySelector('img'), r = img.getBoundingClientRect(), f = document.createElement('img');
    f.src = img.src; f.className = 'fly'; f.style.left = (r.left + r.width / 2 - 23) + 'px'; f.style.top = (r.top + r.height / 2 - 23) + 'px'; document.body.appendChild(f);
    const t = document.querySelector('.ib').getBoundingClientRect();
    requestAnimationFrame(() => { f.style.transform = 'translate(' + (t.left - r.left - r.width / 2 + 43) + 'px,' + (t.top - r.top - r.height / 2 + 43) + 'px) scale(.3)'; f.style.opacity = '.2'; });
    setTimeout(() => f.remove(), 750);
    b.classList.add('done'); b.querySelector('span').textContent = 'check'; setTimeout(() => { b.classList.remove('done'); b.querySelector('span').textContent = 'add'; }, 900);
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (x) {}
    refreshBar();
  }, true);

  function refreshBar() {
    updateCartBadge();
    const lines = cartLines(), n = lines.reduce((a, l) => a + l.qty, 0), bar = document.getElementById('bar');
    if (!n) { bar.style.display = 'none'; return; }
    document.getElementById('bar-n').textContent = n; document.getElementById('bar-p').textContent = money(computeTotals(lines).subtotal);
    bar.style.display = 'flex';
  }
  window.addEventListener('storage', refreshBar);
  document.addEventListener('visibilitychange', refreshBar);
  setInterval(refreshBar, 1500);   // also picks up dishes added from the options screen
  refreshBar();
  document.querySelectorAll('.mode button').forEach(b => b.onclick = () => document.querySelectorAll('.mode button').forEach(x => x.classList.toggle('on', x === b)));
</script>
</body></html>
