<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>La Cabaña Member Card</title>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Cabaña Card"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="theme-color" content="#0c0c0c"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/><link rel="icon" type="image/png" href="icons/favicon-64.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0c0c0c;color:#f5f5f5;font-family:Manrope,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 28px)}
  .card{position:relative;border-radius:26px;overflow:hidden;padding:20px;background:radial-gradient(120% 80% at 100% 0%,rgba(255,138,61,.55),transparent 55%),radial-gradient(90% 70% at 0% 100%,rgba(243,99,16,.35),transparent 60%),linear-gradient(160deg,#241309,#120a05 60%,#0d0907);border:1px solid rgba(255,154,82,.35);box-shadow:0 24px 60px rgba(243,99,16,.22),inset 0 1px 0 rgba(255,255,255,.08)}
  .card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);pointer-events:none}
  .top{display:flex;align-items:center;justify-content:space-between}
  .top img{height:42px}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.18em;color:#ffb27a;border:1px solid rgba(255,178,122,.45);border-radius:999px;padding:5px 10px}
  .nm{font-family:Outfit;font-weight:800;font-size:30px;line-height:1.05;margin:20px 0 4px}
  .code{font-weight:800;font-size:12.5px;letter-spacing:.2em;color:#ffb27a}
  .qrw{display:flex;gap:14px;align-items:center;margin-top:18px}
  .qr{background:#fff;border-radius:16px;padding:10px;flex:none}
  .qr img,.qr canvas{display:block;width:132px;height:132px}
  .offer b{display:block;font-family:Outfit;font-size:19px;line-height:1.15}
  .offer span{display:block;color:#d9c3b4;font-size:13px;line-height:1.4;margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
  .stat{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
  .stat small{display:block;font-size:11px;font-weight:800;color:#c7a690;letter-spacing:.04em}
  .stat b{font-family:Outfit;font-size:24px}
  .btn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:800 16px Manrope,sans-serif;border-radius:16px;padding:15px;cursor:pointer}
  .btn.main{background:linear-gradient(135deg,#ff8a3d,#f36310);color:#1a0800;margin-top:16px}
  .btn.ghost{border:1px solid #333;color:#fff;margin-top:10px}
  .box{background:#161616;border:1px solid #262626;border-radius:22px;padding:16px 18px;margin-top:14px}
  .box h3{font-family:Outfit;font-size:17px;margin:0 0 8px}
  .act{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #222;font-size:14.5px}
  .act:first-of-type{border-top:0}
  .dot{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 13px Outfit}
  .dot.came{background:rgba(74,222,128,.14);color:#4ade80;border:1px solid rgba(74,222,128,.4)}
  .dot.got{background:rgba(255,138,61,.12);color:#ff8a3d;border:1px solid rgba(255,138,61,.4)}
  .act span{color:#8a8a8a;font-size:12.5px;margin-left:auto;white-space:nowrap}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;display:flex;gap:12px;font-size:14px;line-height:1.45;color:#d0d0d0;padding:6px 0}
  .steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #f36310;color:#ff8a3d;font:800 11px Outfit;display:flex;align-items:center;justify-content:center}
  p.m{color:#8a8a8a;font-size:13px;line-height:1.5;text-align:center;margin:14px 0 0}
  .err{text-align:center;padding:80px 10px;color:#a3a3a3}
</style>
</head><body>
<div class="wrap" id="w"><p class="m" style="padding-top:80px">Loading your card…</p></div>
<script>
(async function () {
  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
  const w = document.getElementById('w');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!/^[A-Z0-9]{4,12}$/.test(code)) { w.innerHTML = '<div class="err">This card link isn\'t right. Ask La Cabaña for a new one.</div>'; return; }
  let m = null;
  try {
    const r = await fetch('https://qzluvwpjtgeccfojutbt.supabase.co/rest/v1/rpc/member_card', { method: 'POST', headers: { apikey: 'sb_publishable_LA6q8PrfQSRC5d7tanAamg_erxp0ShJ', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }) });
    const rows = await r.json(); m = Array.isArray(rows) ? rows[0] : null;
  } catch (e) {}
  if (!m) { w.innerHTML = '<div class="err">We couldn\'t find this card. Ask La Cabaña for a new one.</div>'; return; }

  const share = location.origin + '/gift.html?ref=' + code;
  const ago = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 3600 ? Math.max(1, Math.round(s / 60)) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' }); };
  const acts = (m.activity || []);
  w.innerHTML = '<div class="card" id="card"><div class="top"><img src="icons/logo-transparent.png" alt="La Cabaña Grill"><div class="tag">MEMBER</div></div>' +
    '<div class="nm">' + esc(m.name) + '</div><div class="code">' + esc(code) + '</div>' +
    '<div class="qrw"><div class="qr" id="qr"></div><div class="offer"><b>Scan for a free drink</b><span>With your meal at La Cabaña Grill, Miami Beach.</span></div></div>' +
    '<div class="stats"><div class="stat"><small>PINs given</small><b>' + (m.claimed || 0) + '</b></div><div class="stat"><small>Came in</small><b>' + (m.referred || 0) + '</b></div><div class="stat"><small>You earned</small><b>$' + m.points + '</b></div></div></div>' +
    '<button class="btn main" id="b-share">Send to a friend</button><button class="btn ghost" id="b-save">Save card to Photos</button>' +
    '<div class="box"><h3>Your people</h3>' + (acts.length ? acts.map(a => '<div class="act"><div class="dot ' + (a.came ? 'came' : 'got') + '">' + esc((a.n || '#')[0].toUpperCase()) + '</div><div>' + (a.n ? '<b>' + esc(a.n) + '</b>' : 'PIN <b>' + esc(a.c) + '</b>') + ' ' + (a.came ? 'came in · <b style="color:#4ade80">+$1</b>' : 'got a free drink PIN') + '</div><span>' + ago(a.t) + '</span></div>').join('') : '<p class="m" style="margin:4px 0;text-align:left">No one yet. Send your card to a friend.</p>') + '</div>' +
    '<div class="box"><h3>How it works</h3><ul class="steps"><li>A friend scans your QR. They get a free drink PIN.</li><li>They show the PIN at La Cabaña with their meal. It works one time.</li><li>You get <b style="color:#fff">$1</b> to spend here, and see who came in above.</li></ul></div>' +
    '<p class="m">Keep this card: tap <b style="color:#fff">Share</b> then <b style="color:#fff">Add to Home Screen</b>.</p>';
  new QRCode(document.getElementById('qr'), { text: share, width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M });

  const txt = 'Free drink at La Cabaña Grill on me. Scan or open this for your PIN: ' + share;
  document.getElementById('b-share').onclick = () => {
    if (navigator.share) navigator.share({ title: 'Free drink at La Cabaña Grill', text: txt, url: share }).catch(() => {});
    else location.href = 'sms:?&body=' + encodeURIComponent(txt);
  };

  // card image for Photos / Instagram story (1080x1350)
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  document.getElementById('b-save').onclick = async () => {
    await document.fonts.ready;
    const W = 1080, Hh = 1350, c = document.createElement('canvas'); c.width = W; c.height = Hh; const x = c.getContext('2d');
    x.fillStyle = '#0c0c0c'; x.fillRect(0, 0, W, Hh);
    const g = x.createLinearGradient(0, 0, W, Hh); g.addColorStop(0, '#2a150a'); g.addColorStop(.6, '#140b06'); g.addColorStop(1, '#0d0907');
    const R = (X, Y, w2, h2, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w2, Y, X + w2, Y + h2, r); x.arcTo(X + w2, Y + h2, X, Y + h2, r); x.arcTo(X, Y + h2, X, Y, r); x.arcTo(X, Y, X + w2, Y, r); x.closePath(); };
    R(60, 60, W - 120, Hh - 120, 64); x.fillStyle = g; x.fill();
    x.save(); x.clip(); const rg = x.createRadialGradient(W - 80, 80, 10, W - 80, 80, 700); rg.addColorStop(0, 'rgba(255,138,61,.6)'); rg.addColorStop(1, 'rgba(255,138,61,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, Hh); x.restore();
    x.strokeStyle = 'rgba(255,154,82,.45)'; x.lineWidth = 3; R(60, 60, W - 120, Hh - 120, 64); x.stroke();
    const logo = await load('icons/logo-transparent.png'); if (logo) { const h = 120, lw = logo.width * h / logo.height; x.drawImage(logo, 120, 120, lw, h); }
    x.fillStyle = '#fff'; x.font = '800 92px Outfit'; x.fillText(m.name, 120, 400);
    x.fillStyle = '#ffb27a'; x.font = '800 36px Manrope'; x.fillText(code.split('').join(' '), 120, 460);
    R(120, 540, 480, 480, 36); x.fillStyle = '#fff'; x.fill();
    const q = document.querySelector('#qr canvas'); if (q) x.drawImage(q, 150, 570, 420, 420);
    x.fillStyle = '#fff'; x.font = '800 54px Outfit'; x.fillText('Scan for a', 640, 700); x.fillText('free drink', 640, 764);
    x.fillStyle = '#d9c3b4'; x.font = '600 32px Manrope'; x.fillText('With your meal at', 640, 830); x.fillText('La Cabaña Grill', 640, 872);
    x.fillStyle = '#ff8a3d'; x.font = '800 34px Manrope'; x.fillText('6780 Collins Ave · Miami Beach', 120, 1130);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], 'la-cabana-card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'la-cabana-card.png'; a.click(); }
  };
})();
</script>
</body></html>
