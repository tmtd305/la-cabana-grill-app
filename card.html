<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>La Cabaña Member Card</title>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Cabaña Card"/><meta name="theme-color" content="#0c0c0c"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/><link rel="icon" type="image/png" href="icons/favicon-64.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0c0c0c;color:#f5f5f5;font-family:Manrope,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}
  .card{border-radius:24px;overflow:hidden;background:linear-gradient(150deg,#f36310,#ff8a3d 45%,#2a1206);box-shadow:0 20px 50px rgba(243,99,16,.25);padding:22px 20px}
  .top{display:flex;align-items:center;gap:12px}
  .top img{height:46px;background:#fff;border-radius:12px;padding:4px}
  .top b{font-family:Outfit;font-size:20px;color:#111;display:block}
  .top small{font-size:11px;letter-spacing:.14em;font-weight:800;color:#2a1206}
  .nm{font-family:Outfit;font-weight:800;font-size:28px;color:#111;margin:22px 0 2px}
  .code{font-weight:800;font-size:13px;letter-spacing:.12em;color:#2a1206}
  .qr{background:#fff;border-radius:18px;padding:14px;margin:18px auto 0;width:max-content}
  .stats{display:flex;gap:10px;margin-top:16px}
  .stat{flex:1;background:rgba(0,0,0,.28);border-radius:14px;padding:10px 12px}
  .stat small{display:block;font-size:11.5px;font-weight:800;color:#ffd7c2}
  .stat b{font-family:Outfit;font-size:24px}
  p{color:#a3a3a3;font-size:14px;line-height:1.5;text-align:center}
  .err{text-align:center;padding:60px 10px}
</style>
</head><body>
<div class="wrap" id="w"><p>Loading your card…</p></div>
<script>
  (async function () {
    const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
    const w = document.getElementById('w');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    if (!/^[A-Z0-9]{4,12}$/.test(code)) { w.innerHTML = '<div class="err"><p>This card link isn\'t right. Ask La Cabaña for a new one.</p></div>'; return; }
    let m = null;
    try {
      const r = await fetch('https://qzluvwpjtgeccfojutbt.supabase.co/rest/v1/rpc/member_card', { method: 'POST', headers: { apikey: 'sb_publishable_LA6q8PrfQSRC5d7tanAamg_erxp0ShJ', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }) });
      const rows = await r.json(); m = Array.isArray(rows) ? rows[0] : null;
    } catch (e) {}
    if (!m) { w.innerHTML = '<div class="err"><p>We couldn\'t find this card. Ask La Cabaña for a new one.</p></div>'; return; }
    w.innerHTML = '<div class="card"><div class="top"><img src="icons/logo-transparent.png" alt=""><div><b>La Cabaña Grill</b><small>MEMBER CARD</small></div></div>' +
      '<div class="nm">' + esc(m.name) + '</div><div class="code">' + esc(code) + '</div>' +
      '<div class="qr" id="qr"></div>' +
      '<div class="stats"><div class="stat"><small>Points</small><b>' + m.points + '</b></div><div class="stat"><small>Worth</small><b>$' + m.points + '</b></div><div class="stat"><small>People brought</small><b>' + m.referred + '</b></div></div></div>' +
      '<p>Show this QR. When someone scans it and places their first order, you get <b style="color:#fff">1 point = $1</b>.</p>' +
      '<p style="font-size:13px">Keep it handy: tap <b style="color:#fff">Share</b> then <b style="color:#fff">Add to Home Screen</b>.</p>';
    new QRCode(document.getElementById('qr'), { text: location.origin + '/home.html?ref=' + code, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  })();
</script>
</body></html>
