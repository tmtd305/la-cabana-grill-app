<div id="account-view" class="hidden flex-col gap-space-lg">
<div class="bg-surface-container rounded-xl p-space-lg flex items-center gap-space-sm">
<label class="relative w-16 h-16 rounded-full bg-primary bg-cover bg-center flex items-center justify-center shrink-0 cursor-pointer" id="view-photo" title="Change photo"><span class="material-symbols-outlined text-on-primary text-[28px]" id="view-photo-icon">person</span><span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-primary-container flex items-center justify-center shadow"><span class="material-symbols-outlined text-white text-[14px]">photo_camera</span></span><input type="file" accept="image/*" class="hidden" id="view-photo-input"></label>
<div class="min-w-0">
<p id="view-name" class="font-headline-md text-headline-md text-text-primary truncate"></p>
<p id="view-email" class="font-body-sm text-body-sm text-text-muted truncate"></p>
</div>
</div>
<div class="bg-surface-container rounded-xl p-space-lg flex flex-col gap-space-md">
<div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-primary-container text-[20px]">call</span><p id="view-phone" class="font-body-md text-body-md text-text-primary"></p></div>
<div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-primary-container text-[20px]">location_on</span><p id="view-address" class="font-body-md text-body-md text-text-primary"></p></div>
<div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-primary-container text-[20px]">sms</span><p id="view-sms" class="font-body-md text-body-md text-text-primary"></p></div>
</div>
<button onclick="editAccount()" class="w-full h-12 rounded-full bg-surface-container-high text-text-primary font-label-lg text-label-lg flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[18px]">edit</span>Edit Info</button>
<button onclick="signOutAccount()" class="w-full h-12 rounded-full text-error font-label-lg text-label-lg flex items-center justify-center gap-2">Sign Out</button>
</div>

<form id="account-form" class="flex flex-col gap-space-lg">
<div>
<h1 class="font-headline-lg text-headline-lg text-text-primary">Create Your Account</h1>
<p class="font-body-sm text-body-sm text-text-muted mt-1">Save your info for faster checkout and order updates.</p>
</div>
<div class="flex flex-col gap-space-sm">
<div class="flex items-center gap-space-md">
<label class="relative w-20 h-20 rounded-full bg-surface-container-low bg-cover bg-center flex items-center justify-center shrink-0 cursor-pointer border-2 border-dashed border-outline-variant" id="f-photo-prev"><span class="material-symbols-outlined text-text-muted text-[30px]" id="f-photo-icon">add_a_photo</span><input type="file" accept="image/*" class="hidden" id="f-photo"></label>
<div><p class="font-label-lg text-label-lg text-text-primary">Profile photo</p><p class="font-body-sm text-body-sm text-text-muted">So our team knows who they're talking to when you order by voice.</p></div>
</div>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Full Name</span>
<input id="f-name" required type="text" placeholder="Jane Rodriguez" class="h-12 rounded-xl bg-surface-container-low px-4 text-text-primary placeholder:text-text-muted outline-none focus:ring-2 focus:ring-primary-container"/>
</label>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Phone Number</span>
<input id="f-phone" required type="tel" placeholder="(305) 555-0100" class="h-12 rounded-xl bg-surface-container-low px-4 text-text-primary placeholder:text-text-muted outline-none focus:ring-2 focus:ring-primary-container"/>
</label>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Email</span>
<input id="f-email" required type="email" placeholder="jane@email.com" class="h-12 rounded-xl bg-surface-container-low px-4 text-text-primary placeholder:text-text-muted outline-none focus:ring-2 focus:ring-primary-container"/>
</label>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Address</span>
<input id="f-address" required type="text" placeholder="123 Ocean Dr, Miami Beach, FL" class="h-12 rounded-xl bg-surface-container-low px-4 text-text-primary placeholder:text-text-muted outline-none focus:ring-2 focus:ring-primary-container"/>
</label>
</div>
<label class="flex items-start gap-space-sm bg-surface-container rounded-xl p-space-md cursor-pointer">
<input id="f-sms" type="checkbox" checked class="accent-primary-container w-5 h-5 mt-0.5 shrink-0"/>
<span class="font-body-sm text-body-sm text-text-secondary">Yes, text me deals and order updates. Msg &amp; data rates may apply. Reply STOP to opt out anytime.</span>
</label>
<button type="submit" class="w-full h-14 rounded-full bg-primary-container text-white font-label-lg text-label-lg shadow-[0_8px_24px_rgba(243,99,16,0.35)]">Create Account</button>
</form>

</div></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-8px_24px_rgba(0,0,0,0.55)]" data-active-classes="text-primary-container font-headline-md"><div class="h-16 px-gutter flex items-center justify-around"><a class="flex flex-col items-center justify-center min-w-[56px] h-full gap-0.5 text-text-secondary transition-colors hover:text-text-primary" data-path="home" href="home.html"><span class="material-symbols-outlined text-[24px]">local_fire_department</span><span class="font-label-caps text-label-caps">Home</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-full gap-0.5 text-text-secondary transition-colors hover:text-text-primary" data-path="menu" href="menu.html"><span class="material-symbols-outlined text-[24px]">restaurant_menu</span><span class="font-label-caps text-label-caps">Menu</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-full gap-0.5 text-text-secondary transition-colors hover:text-text-primary" data-path="orders" href="orders.html"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="font-label-caps text-label-caps">Orders</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-full gap-0.5 text-text-secondary transition-colors hover:text-text-primary" data-path="favorites" href="#" onclick="event.preventDefault(); showToast('Favorites coming soon')"><span class="material-symbols-outlined text-[24px]">favorite</span><span class="font-label-caps text-label-caps">Favorites</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-full gap-0.5 transition-colors text-primary-container font-headline-md" data-path="account" href="account.html"><span class="material-symbols-outlined text-[24px]">account_circle</span><span class="font-label-caps text-label-caps">Account</span></a></div></nav>
<script>
function renderAccount() {
  const account = getAccount();
  const formEl = document.getElementById("account-form");
  const viewEl = document.getElementById("account-view");
  if (account) {
    formEl.classList.add("hidden");
    viewEl.classList.remove("hidden");
    viewEl.classList.add("flex");
    document.getElementById("view-name").textContent = account.name;
    document.getElementById("view-email").textContent = account.email;
    document.getElementById("view-phone").textContent = account.phone;
    document.getElementById("view-address").textContent = account.address;
    document.getElementById("view-sms").textContent = account.sms ? "SMS marketing: On" : "SMS marketing: Off";
    setPhoto("view-photo", "view-photo-icon", account.photo);
  } else {
    formEl.classList.remove("hidden");
    viewEl.classList.add("hidden");
    viewEl.classList.remove("flex");
  }
}

function editAccount() {
  const account = getAccount();
  if (account) {
    document.getElementById("f-name").value = account.name;
    document.getElementById("f-phone").value = account.phone;
    document.getElementById("f-email").value = account.email;
    document.getElementById("f-address").value = account.address;
    document.getElementById("f-sms").checked = account.sms;
    formPhoto = account.photo || "";
    setPhoto("f-photo-prev", "f-photo-icon", formPhoto);
  }
  document.getElementById("account-view").classList.add("hidden");
  document.getElementById("account-view").classList.remove("flex");
  document.getElementById("account-form").classList.remove("hidden");
}

var formPhoto = "";
function setPhoto(boxId, iconId, photo) {
  var box = document.getElementById(boxId), icon = document.getElementById(iconId);
  box.style.backgroundImage = photo ? "url(" + photo + ")" : "";
  icon.style.display = photo ? "none" : "";
}
document.getElementById("f-photo").addEventListener("change", async function (e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  try { formPhoto = await shrinkPhoto(f); setPhoto("f-photo-prev", "f-photo-icon", formPhoto); } catch (err) { showToast(err.message); }
});
document.getElementById("view-photo-input").addEventListener("change", async function (e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  try { var a = getAccount(); a.photo = await shrinkPhoto(f); saveAccount(a); renderAccount(); showToast("Photo updated"); } catch (err) { showToast(err.message); }
});

function signOutAccount() {
  clearAccount();
  renderAccount();
  showToast("Signed out");
}

document.getElementById("account-form").addEventListener("submit", function (e) {
  e.preventDefault();
  saveAccount({
    name: document.getElementById("f-name").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    address: document.getElementById("f-address").value.trim(),
    sms: document.getElementById("f-sms").checked,
    photo: formPhoto
  });
  showToast("Account created");
  renderAccount();
});

document.addEventListener("DOMContentLoaded", renderAccount);
</script>
</body></html>
