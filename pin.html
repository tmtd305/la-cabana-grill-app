<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Free Drink PIN</title>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Drink PIN"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="theme-color" content="#0c0c0c"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"/><link rel="icon" type="image/png" href="icons/favicon-64.png?v=2"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0c0c0c;color:#f5f5f5;font-family:Manrope,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  .wrap{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px)}
  .top{display:flex;align-items:center;gap:10px}
  .top img{height:36px}.top b{font-family:Outfit;font-size:20px}
  .dots{display:flex;justify-content:center;gap:14px;margin:34px 0 10px}
  .d{width:62px;height:76px;border-radius:16px;border:2px solid #2e2e2e;display:flex;align-items:center;justify-content:center;font:800 40px Outfit}
  .d.on{border-color:#f36310}
  .msg{min-height:74px;text-align:center;font-weight:800;font-size:17px;line-height:1.35;padding:8px 6px;border-radius:16px;margin-bottom:12px}
  .msg.ok{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.5)}
  .msg.no{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.45)}
  .msg.idle{color:#8a8a8a;font-weight:700}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
  .k{all:unset;height:68px;border-radius:18px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font:700 30px Outfit;cursor:pointer}
  .k:active{background:#2a2a2a}
  .k.sm{font:800 15px Manrope}
  .go{all:unset;grid-column:1/-1;height:62px;border-radius:18px;background:#f36310;color:#1a0800;display:flex;align-items:center;justify-content:center;font:800 19px Manrope;cursor:pointer}
  .go[disabled]{opacity:.4}
  a{color:#ff8a3d}
</style>
</head><body>
<div class="wrap">
  <div class="top"><img src="icons/logo-transparent.png" alt=""><b>Free drink PIN</b></div>
  <div class="dots" id="dots"><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div></div>
  <div class="msg idle" id="msg">Type the guest's 4-digit PIN</div>
  <div class="pad" id="pad">
    <button class="k">1</button><button class="k">2</button><button class="k">3</button>
    <button class="k">4</button><button class="k">5</button><button class="k">6</button>
    <button class="k">7</button><button class="k">8</button><button class="k">9</button>
    <button class="k sm" data-k="c">Clear</button><button class="k">0</button><button class="k sm" data-k="b">Delete</button>
    <button class="go" id="go" disabled>Use PIN</button>
  </div>
</div>
<script>
  const sb = supabase.createClient('https://qzluvwpjtgeccfojutbt.supabase.co', 'sb_publishable_LA6q8PrfQSRC5d7tanAamg_erxp0ShJ');
  let v = '', busy = false;
  const msg = (t, c) => { const m = document.getElementById('msg'); m.className = 'msg ' + c; m.innerHTML = t; };
  const paint = () => { document.querySelectorAll('.d').forEach((d, i) => { d.textContent = v[i] || ''; d.classList.toggle('on', i === v.length); }); document.getElementById('go').disabled = v.length !== 4; };
  paint();
  document.getElementById('pad').addEventListener('click', e => {
    const k = e.target.closest('.k'); if (!k || busy) return;
    if (k.dataset.k === 'c') v = ''; else if (k.dataset.k === 'b') v = v.slice(0, -1); else if (v.length < 4) v += k.textContent;
    if (v.length < 4 && !document.getElementById('msg').classList.contains('idle')) msg('Type the guest\'s 4-digit PIN', 'idle');
    paint();
  });
  document.getElementById('go').onclick = async () => {
    if (v.length !== 4 || busy) return; busy = true; msg('Checking…', 'idle');
    const { data, error } = await sb.rpc('redeem_gift', { p_code: v }); busy = false;
    const r = data && data[0];
    if (error) {
      if (/not_operator|JWT|auth/i.test(error.message)) msg('Sign in first: <a href="admin.html">open the dashboard</a>, sign in, then come back.', 'no');
      else if (/not_found/.test(error.message)) msg('PIN ' + v + ' doesn\'t exist.<br>No free drink.', 'no');
      else msg('Couldn\'t check it. Try again.', 'no');
      return;
    }
    if (r.already) msg('PIN ' + v + ' was already used<br>' + new Date(r.redeemed_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '. No free drink.', 'no');
    else msg('Good. Give a free drink' + (r.name ? ' to ' + r.name.replace(/[<>&]/g, '') : '') + '.<br><span style="font-weight:700;font-size:14px">Sent by ' + r.member_name.replace(/[<>&]/g, '') + ' (+$1 to them)</span>', 'ok');
    v = ''; paint();
  };
  document.addEventListener('keydown', e => { if (/^\d$/.test(e.key) && v.length < 4) v += e.key; else if (e.key === 'Backspace') v = v.slice(0, -1); else if (e.key === 'Enter') return document.getElementById('go').click(); else return; paint(); });
</script>
</body></html>
